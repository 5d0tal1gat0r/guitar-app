[project]
name = "guitar-app"
version = "0.1.0"
description = "Open-source guitar practice app for Linux: mic pitch feedback, metronome, theory and exercises."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "5d0tal1gat0r" }]
keywords = ["guitar", "music", "pitch-detection", "metronome", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "PySide6>=6.7",
    "pyguitarpro>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
guitar-app = "guitarapp.__main__:main"

[project.urls]
Homepage = "https://github.com/5d0tal1gat0r/guitar-app"
Issues = "https://github.com/5d0tal1gat0r/guitar-app/issues"
Source = "https://github.com/5d0tal1gat0r/guitar-app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guitarapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
