[project]
name = "guitar-app"
version = "0.1.0"
description = "Open-source guitar practice app for Linux: mic pitch feedback, metronome, theory and exercises."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "PySide6>=6.7",
    "pyguitarpro>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
guitar-app = "guitarapp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guitarapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
