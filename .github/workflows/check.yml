name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libxkbcommon0
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - name: GUI starts offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python -c "from PySide6.QtWidgets import QApplication; from guitarapp.ui import MainWindow; app = QApplication([]); MainWindow().close()"
